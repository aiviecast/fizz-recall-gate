[package]
name = "fizz_recall_gate"
version = "0.2.0"
description = "Fizz recall gate — trim a RecallResult to the brain budget (recent few) and provide the memory-less fallback when recall misses its deadline"

[dependencies]
fizz_protocol = { git = "https://github.com/aiviecast/fizz-protocol", tag = "v0.3.0" }

# Dialect epoch 15 (#4093): a git dependency outside github.com/almide is fetched only
# from an owner the root manifest trusts.
[trust]
owners = ["github.com/aiviecast"]
